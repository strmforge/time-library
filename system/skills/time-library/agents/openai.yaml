interface:
  display_name: "Time Library"
  short_description: "Use for prior decisions, corrections, already-built work, status, and next steps"
  default_prompt: "Use $time-library before memory-dependent answers. For previous decisions, corrections, already-built work, install/test/release status, source-backed evidence, or next-step follow-ups, call time_library_recall first with a narrow query in the user's own words (limit 3). Treat it as a standing active memory rule, not a one-time setup note. Use time_library_source with a memory number when its original context matters. After the work, return memories you relied on with time_library_return (useful, useless or misleading), judged only from what happened. If nothing comes back, say Time Library has nothing on it yet; if the tools are missing, say the MCP/tool connection is missing."
dependencies:
  tools:
    - type: "mcp"
      value: "time-library"
      description: "Time Library memory service; call time_library_recall for source-backed recall before memory-dependent answers"
      connection_owner: "host"
policy:
  allow_implicit_invocation: true
