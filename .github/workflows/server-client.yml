name: server and client

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/server_client -q

  image:
    # Published only from a release tag, after the tests pass.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        # The release tag, the image tag and the version the server says it is are one thing:
        # an update from the admin page checks that they agree.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          said="$(sed -n 's/^SERVER_VERSION = "\([^"]*\)".*/\1/p' tl_server/__init__.py)"
          test "$tag" = "$said" || { echo "tag $tag but SERVER_VERSION is $said"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/nas/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/strmforge/time-library-server:${{ steps.version.outputs.tag }}
            ghcr.io/strmforge/time-library-server:latest
          labels: |
            org.opencontainers.image.source=https://github.com/strmforge/time-library
            org.opencontainers.image.description=Time Library server (NAS)
            org.opencontainers.image.licenses=MIT
